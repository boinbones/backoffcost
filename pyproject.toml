[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boinbones-backoffcost"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出重试与退避的成本上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "boinbones" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://boinbones.github.io"
Repository = "https://github.com/boinbones/backoffcost"
Issues = "https://github.com/boinbones/backoffcost/issues"

[project.scripts]
backoffcost = "backoffcost:main"

[tool.setuptools]
py-modules = ["backoffcost"]
